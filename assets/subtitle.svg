<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="850" height="48">
  <style>
  /* <![CDATA[ */
    @keyframes lineCycle1 {
      0% { opacity: 0; transform: translateY(3px); }
      3% { opacity: 1; transform: translateY(0); }
      22% { opacity: 1; transform: translateY(0); }
      24% { opacity: 0; transform: translateY(-3px); }
      25%, 100% { opacity: 0; }
    }
    @keyframes lineCycle2 {
      0%, 24.9% { opacity: 0; transform: translateY(3px); }
      25% { opacity: 0; transform: translateY(3px); }
      28% { opacity: 1; transform: translateY(0); }
      47% { opacity: 1; transform: translateY(0); }
      49% { opacity: 0; transform: translateY(-3px); }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineCycle3 {
      0%, 49.9% { opacity: 0; transform: translateY(3px); }
      50% { opacity: 0; transform: translateY(3px); }
      53% { opacity: 1; transform: translateY(0); }
      72% { opacity: 1; transform: translateY(0); }
      74% { opacity: 0; transform: translateY(-3px); }
      75%, 100% { opacity: 0; }
    }
    @keyframes lineCycle4 {
      0%, 74.9% { opacity: 0; transform: translateY(3px); }
      75% { opacity: 0; transform: translateY(3px); }
      78% { opacity: 1; transform: translateY(0); }
      97% { opacity: 1; transform: translateY(0); }
      99% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .l1 { animation: lineCycle1 16s infinite ease-in-out; }
    .l2 { animation: lineCycle2 16s infinite ease-in-out; }
    .l3 { animation: lineCycle3 16s infinite ease-in-out; }
    .l4 { animation: lineCycle4 16s infinite ease-in-out; }

    .cursor {
      animation: blinkCursor 0.75s infinite;
      fill: #58a6ff;
      font-weight: 800;
    }
  /* ]]> */
  </style>

  <g>
    <!-- Line 1: Deepak Bathirachalam -->
    <g class="l1">
      <text x="425" y="24" class="sub-text" fill="#f0f6fc">
        <tspan fill="#58a6ff">&gt; </tspan>Deepak Bathirachalam<tspan class="cursor" fill="#58a6ff"> ▋</tspan>
      </text>
    </g>

    <!-- Line 2: 1st Place Winner • API Heist TechnoVIT -->
    <g class="l2">
      <text x="425" y="24" class="sub-text" fill="#ffa657">
        <tspan fill="#58a6ff">&gt; </tspan>1st Place Winner <tspan fill="#8b949e">•</tspan> API Heist TechnoVIT<tspan class="cursor" fill="#58a6ff"> ▋</tspan>
      </text>
    </g>

    <!-- Line 3: B.Tech IT '29 • Ocular & Systems Dev -->
    <g class="l3">
      <text x="425" y="24" class="sub-text" fill="#58a6ff">
        <tspan fill="#58a6ff">&gt; </tspan>B.Tech IT '29 <tspan fill="#8b949e">•</tspan> Systems Dev &amp; Edge AI<tspan class="cursor" fill="#58a6ff"> ▋</tspan>
      </text>
    </g>

    <!-- Line 4: Open to Software Engineering Internships! -->
    <g class="l4">
      <text x="425" y="24" class="sub-text" fill="#3fb950">
        <tspan fill="#58a6ff">&gt; </tspan>Open to Software Engineering Internships! 🚀<tspan class="cursor" fill="#58a6ff"> ▋</tspan>
      </text>
    </g>
  </g>
</svg>